<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroTrade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    .header p {
      margin-top: 6px;
      font-size: 14px;
      color: #64748b;
    }

    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 620px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      line-height: 1.6;
      padding: 14px;
      resize: vertical;
      min-height: 110px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #3b82f6;
    }

    textarea::placeholder {
      color: #4a5568;
    }

    .examples {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: #1a2235;
      border: 1px solid #2d3748;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .mode-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2d3748;
      background: #0f1117;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: #1d3a5f;
      border-color: #3b82f6;
      color: #60a5fa;
    }

    .submit-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s;
    }

    .submit-btn:hover { background: #1d4ed8; }
    .submit-btn:disabled { background: #1e3a5f; color: #4a6fa5; cursor: not-allowed; }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .qty-row label {
      margin: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qty-input {
      width: 100px;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    .qty-input:focus { border-color: #3b82f6; }

    .qty-hint {
      font-size: 12px;
      color: #4a5568;
    }

    .confirm-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .confirm-btn {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: #059669;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .confirm-btn:hover { background: #047857; }
    .confirm-btn:disabled { background: #1e3a2e; color: #4a7a5f; cursor: not-allowed; }

    .cancel-btn {
      flex: 0 0 120px;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #4a5568;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .cancel-btn:hover { border-color: #f87171; color: #f87171; }

    /* Result panel */
    .result {
      margin-top: 24px;
      display: none;
    }

    .result.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge.success { background: #064e3b; color: #34d399; }
    .badge.error   { background: #450a0a; color: #f87171; }
    .badge.parsed  { background: #1e1b4b; color: #a78bfa; }

    .trade-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .trade-item {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .trade-item .t-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .trade-item .t-value {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .trade-item .t-value.buy  { color: #34d399; }
    .trade-item .t-value.sell { color: #f87171; }
    .trade-item .t-value.sl   { color: #fbbf24; }
    .trade-item .t-value.tgt  { color: #60a5fa; }

    .order-result {
      margin-top: 14px;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      color: #94a3b8;
    }

    .order-result span { color: #f1f5f9; font-weight: 600; }

    .error-box {
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff33;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .raw-tip {
      margin-top: 14px;
      font-size: 12px;
      color: #4a5568;
      font-style: italic;
    }

    /* Auth status bar */
    .auth-bar {
      width: 100%;
      max-width: 620px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .auth-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .auth-dot.green { background: #34d399; box-shadow: 0 0 6px #34d399; }
    .auth-dot.red   { background: #f87171; }

    .auth-text { color: #94a3b8; flex: 1; }
    .auth-text span { color: #e2e8f0; font-weight: 600; }

    .login-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #3b82f6;
      background: transparent;
      color: #60a5fa;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      margin-left: 8px;
    }

    .login-btn:hover { background: #1d3a5f; }

    .logout-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      margin-left: 8px;
    }

    .logout-btn:hover { border-color: #f87171; color: #f87171; }

    .balance-bar {
      width: 100%;
      max-width: 620px;
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .balance-tile {
      flex: 1;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .balance-tile .b-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .balance-tile .b-value {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .balance-tile .b-value.green { color: #34d399; }
    .balance-tile .b-value.red   { color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ZeroTrade</h1>
    <p>Paste a trading tip — LLM parses it — Zerodha executes it</p>
  </div>

  <!-- Auth status bar -->
  <div class="auth-bar" id="authBar">
    <span class="auth-dot red" id="authDot"></span>
    <span class="auth-text" id="authText">Checking auth status...</span>
    <div>
      <a class="login-btn" href="/auth/login" id="loginBtn">Connect Zerodha</a>
      <a class="logout-btn" href="/logout">Sign out</a>
    </div>
  </div>

  <!-- Balance bar -->
  <div class="balance-bar" id="balanceBar" style="display:none">
    <div class="balance-tile">
      <div class="b-label">Available Balance</div>
      <div class="b-value green" id="balAvailable">—</div>
    </div>
    <div class="balance-tile">
      <div class="b-label">Margin Used</div>
      <div class="b-value red" id="balUsed">—</div>
    </div>
  </div>

  <div class="card">
    <label>Trading Tip</label>
    <textarea id="tipText" placeholder="e.g. Buy RELIANCE above 2450, SL 2420, target 2500"></textarea>

    <div class="examples">
      <span class="chip" onclick="fillExample('Buy RELIANCE above 2450, SL 2420, target 2500')">RELIANCE BUY</span>
      <span class="chip" onclick="fillExample('SELL INFY 1800 SL 1820 TGT 1750 qty 10')">INFY SELL</span>
      <span class="chip" onclick="fillExample('BUY TATAMOTORS CMP 950 SL 930 T1 980 T2 1000')">TATAMOTORS BUY</span>
      <span class="chip" onclick="fillExample('Short HDFCBANK below 1650 SL 1670 target 1610')">HDFCBANK SHORT</span>
      <span class="chip" onclick="fillExample('Buy ZYDUS LIFESCIENCES above 1248, SL 1240, target 1340, swing trade')">ZYDUS SWING (CNC)</span>
    </div>

    <div class="qty-row">
      <label>Quantity</label>
      <input class="qty-input" id="quantity" type="number" min="1" step="1" value="1"/>
      <span class="qty-hint">overrides qty in tip text</span>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="analyse()">Analyse Tip</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    let pendingTip = null;  // stores tip text after parse, before confirm

    function getQuantity() {
      const v = parseInt(document.getElementById('quantity').value, 10);
      return (v && v > 0) ? v : 1;
    }

    function fillExample(text) {
      document.getElementById('tipText').value = text;
      resetResult();
    }

    function resetResult() {
      pendingTip = null;
      const resultEl = document.getElementById('result');
      resultEl.classList.remove('show');
      resultEl.innerHTML = '';
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = 'Analyse Tip';
    }

    async function analyse() {
      const tip = document.getElementById('tipText').value.trim();
      if (!tip) return;

      const btn = document.getElementById('submitBtn');
      const resultEl = document.getElementById('result');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Parsing...';
      resultEl.classList.remove('show');

      try {
        const res = await fetch('/api/trade/parse-only', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipText: tip, quantity: getQuantity() }),
        });
        const data = await res.json();

        if (!res.ok) {
          resultEl.innerHTML = `
            <div class="result-header"><span class="badge error">Parse Failed</span></div>
            <div class="error-box">${data.detail || 'Could not parse the tip.'}</div>`;
        } else {
          pendingTip = tip;
          resultEl.innerHTML = renderConfirm(data);
        }
        resultEl.classList.add('show');
      } catch (e) {
        resultEl.innerHTML = `
          <div class="result-header"><span class="badge error">Error</span></div>
          <div class="error-box">Could not reach the server.</div>`;
        resultEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analyse Tip';
      }
    }

    async function execute() {
      if (!pendingTip) return;

      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = '<span class="spinner"></span>Placing order...';

      try {
        const res = await fetch('/api/trade/parse-and-execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipText: pendingTip, quantity: getQuantity() }),
        });
        const data = await res.json();
        const resultEl = document.getElementById('result');

        if (!res.ok || !data.success) {
          resultEl.innerHTML = `
            <div class="result-header"><span class="badge error">${data.orderStatus || 'Failed'}</span></div>
            <div class="error-box">${data.detail || data.errorMessage || 'Order placement failed.'}</div>
            ${data.parsedTrade ? tradeGrid(data.parsedTrade) : ''}
            <div class="confirm-row">
              <button class="cancel-btn" onclick="resetResult()">Dismiss</button>
            </div>`;
        } else {
          resultEl.innerHTML = `
            <div class="result-header"><span class="badge success">Order Placed</span></div>
            ${tradeGrid(data.parsedTrade)}
            <div class="order-result">
              Order ID: <span>${data.orderId}</span> &nbsp;·&nbsp; Status: <span>${data.orderStatus}</span>
              ${data.gttId ? `&nbsp;·&nbsp; GTT OCO: <span>${data.gttId}</span>` : ''}
            </div>
            <div class="raw-tip">Tip: "${data.parsedTrade?.rawTip || ''}"</div>
            <div class="confirm-row">
              <button class="cancel-btn" onclick="resetResult()">Done</button>
            </div>`;
          pendingTip = null;
        }
      } catch (e) {
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').textContent = 'Confirm & Place Order';
      }
    }

    function renderConfirm(t) {
      const productColor = t.product === 'CNC' ? '#a78bfa' : '#60a5fa';
      const gttNote = t.product === 'CNC' && t.stopLossPrice && t.targetPrice
        ? `<div style="margin-top:10px;padding:10px 14px;background:#1a1f35;border:1px solid #3b3f6e;border-radius:8px;font-size:12px;color:#a78bfa">
             GTT OCO will also be placed — exits automatically at SL or target.
           </div>`
        : '';
      return `
        <div class="result-header"><span class="badge parsed">Review Trade</span></div>
        ${tradeGrid(t)}
        ${gttNote}
        <div class="raw-tip">Tip: "${t.rawTip || ''}"</div>
        <div class="confirm-row">
          <button class="confirm-btn" id="confirmBtn" onclick="execute()">Confirm &amp; Place Order</button>
          <button class="cancel-btn" onclick="resetResult()">Cancel</button>
        </div>`;
    }

    function tradeGrid(t) {
      const actionClass = t.action === 'BUY' ? 'buy' : 'sell';
      const fmt = v => v != null ? Number(v).toLocaleString('en-IN') : '—';
      const productColor = t.product === 'CNC' ? '#a78bfa' : '#60a5fa';
      return `
        <div class="trade-grid">
          <div class="trade-item">
            <div class="t-label">Symbol</div>
            <div class="t-value">${t.symbol || '—'}</div>
          </div>
          <div class="trade-item">
            <div class="t-label">Action</div>
            <div class="t-value ${actionClass}">${t.action || '—'}</div>
          </div>
          <div class="trade-item">
            <div class="t-label">Entry Price</div>
            <div class="t-value">₹${fmt(t.entryPrice)}</div>
          </div>
          <div class="trade-item">
            <div class="t-label">Stop Loss</div>
            <div class="t-value sl">₹${fmt(t.stopLossPrice)}</div>
          </div>
          <div class="trade-item">
            <div class="t-label">Target</div>
            <div class="t-value tgt">₹${fmt(t.targetPrice)}</div>
          </div>
          ${t.target2Price != null ? `
          <div class="trade-item">
            <div class="t-label">Target 2</div>
            <div class="t-value tgt" style="opacity:0.7">₹${fmt(t.target2Price)}</div>
          </div>` : ''}
          <div class="trade-item">
            <div class="t-label">Qty · Order · Exchange</div>
            <div class="t-value" style="font-size:13px">${t.quantity || '—'} · ${t.orderType || '—'} · ${t.exchange || '—'}</div>
          </div>
          <div class="trade-item">
            <div class="t-label">Product</div>
            <div class="t-value" style="font-size:13px;color:${productColor}">${t.product || 'MIS'}</div>
          </div>
        </div>`;
    }

    document.getElementById('tipText').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') analyse();
    });

    async function checkAuthStatus() {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();
        const dot  = document.getElementById('authDot');
        const text = document.getElementById('authText');
        const btn  = document.getElementById('loginBtn');

        if (data.tokenSet) {
          dot.className  = 'auth-dot green';
          const time = data.tokenSetAt || '';
          text.innerHTML = `Zerodha connected &nbsp;·&nbsp; <span>Token set at ${time}</span> — valid till midnight`;
          btn.textContent = 'Reconnect Zerodha';
          fetchBalance();
        } else {
          dot.className  = 'auth-dot red';
          text.innerHTML = 'Zerodha not connected &nbsp;·&nbsp; Login to enable order placement';
          btn.textContent = 'Connect Zerodha';
          document.getElementById('balanceBar').style.display = 'none';
        }
      } catch (_) {
        document.getElementById('authText').textContent = 'Could not reach server';
      }
    }

    async function fetchBalance() {
      try {
        const res = await fetch('/api/balance');
        if (!res.ok) return;
        const data = await res.json();
        const fmt = v => '₹' + Number(v).toLocaleString('en-IN', {maximumFractionDigits: 2});
        document.getElementById('balAvailable').textContent = fmt(data.available);
        document.getElementById('balUsed').textContent      = fmt(data.used);
        document.getElementById('balanceBar').style.display = 'flex';
      } catch (_) {}
    }

    checkAuthStatus();
    setInterval(checkAuthStatus, 60000);
  </script>
</body>
</html>
